name: Build Android APK & Web

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Server tests
        working-directory: server
        run: npm ci && npm test

      - name: Build web
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}        # 手机 App 默认连接的后端地址，例如 https://care.example.com
          VITE_HOTLINE: ${{ vars.HOTLINE }}
          VITE_APK_URL: ${{ vars.APK_URL }}
        run: npm ci && npm run build

      - name: Sync Capacitor
        working-directory: web
        run: npx cap sync android

      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed, if keystore secret is set)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: web/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp web/android/app/build/outputs/apk/debug/app-debug.apk out/anxin-care-debug.apk
          [ -f web/android/app/build/outputs/apk/release/app-release.apk ] && cp web/android/app/build/outputs/apk/release/app-release.apk out/anxin-care-release.apk || true
          tar czf out/web-dist.tar.gz -C web dist
      - uses: actions/upload-artifact@v4
        with:
          name: anxin-care-build
          path: out/

      - name: GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
