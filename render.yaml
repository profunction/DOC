# Render.com 一键部署（Blueprint）：在 Render 新建 Blueprint，选这个仓库即可。
# 免费方案没有持久磁盘，重新部署后数据会重置（演示够用）；正式使用请选带磁盘的方案并把 DATA_DIR 指到磁盘。
services:
  - type: web
    name: anxin-care
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8787
      - key: SEED_DEMO
        value: "1"
      - key: HOTLINE_PHONE
        value: "60123456789"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_KEY
        generateValue: true
    healthCheckPath: /api/public/info
