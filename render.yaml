# Render.com 一键部署（Blueprint）：在 Render 新建 Blueprint，选这个仓库即可。
# 免费方案没有持久磁盘，重新部署后数据会重置（演示够用）；正式使用请选带磁盘的方案并把 DATA_DIR 指到磁盘。
services:
  - type: web
    name: anxin-care
    runtime: docker
    plan: free
    region: singapore
    branch: claude/new-session-1skmg3     # 仓库目前只有这条分支；合并到 main 后改成 main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8787
      - key: SEED_DEMO
        value: "1"
      - key: HOTLINE_PHONE
        value: "60123456789"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: ADMIN_PHONE          # 你自己的手机号，部署时 Render 会提示填写
        sync: false
      - key: ADMIN_PASSWORD       # 你自己的密码
        sync: false
    healthCheckPath: /api/public/info
